name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: quality-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5
        with:
          version: 2026.10.24
          cache: false
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm exec playwright install --with-deps chromium firefox webkit
      - run: mise --locked run check
